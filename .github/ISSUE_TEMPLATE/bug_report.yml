name: Bug report
description: Report a reproducible problem in tynt.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve tynt. Please do not include private security details here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Game runtime
        - Gallery or library
        - Sprite editor
        - Documentation
        - Cartridge tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the smallest reproducible sequence and any visible error.
      placeholder: Describe what you did and what tynt displayed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on macOS 26
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain sensitive security details.
          required: true
